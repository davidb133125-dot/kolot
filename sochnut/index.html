<title>סוכנות הבלשים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<style>
/* Layout: case-file app shell (manila paper, ink navy, stamp red) around a full-screen pixel-art city */
:root{
  --paper:#f3ead6; --paper-2:#e8dbbd; --card:#fffaf0; --ink:#1f2a3a; --ink-soft:#4a5568;
  --muted:#7a6f5c; --line:#d9caa6; --navy:#22344f; --navy-2:#2f4a6e; --stamp:#b8322a;
  --brass:#c08a2d; --brass-soft:#f4e2b8; --good:#2f7d4f; --good-soft:#dcefe2; --bad:#b8322a; --bad-soft:#f6dcd8;
  --display:"Suez One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
#app{direction:rtl;min-height:100%;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:42px;height:42px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.brand h1{font-size:22px;color:var(--navy)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;border:0}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;color:var(--muted);font-weight:700;font-size:14px}
.nav button[aria-current="page"]{color:var(--navy)}
.nav svg{width:24px;height:24px}

/* cards */
.stack{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--brass)}
.muted{color:var(--muted)}
.hello h2{font-size:30px;color:var(--navy)}
.rank-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brass-soft);color:#6b4a12;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.case-hero{padding:0;overflow:hidden}
.case-hero canvas{display:block;width:100%;height:170px;image-rendering:pixelated;background:#5f8f45}
.case-hero .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.case-tab{display:inline-block;align-self:flex-start;background:var(--navy);color:#fff;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700}
.case-hero h3{font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.primary{background:var(--navy);color:#fff;flex:1 1 170px}
.btn.soft{background:var(--paper-2);color:var(--navy);flex:1 1 140px}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.stack>.btn{flex:0 0 auto}
.zones{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.zone{flex:0 0 132px;scroll-snap-align:start;border-radius:12px;padding:12px;background:var(--paper-2);display:flex;flex-direction:column;gap:6px;min-height:104px;border:0;text-align:right}
.zone .n{width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--navy)}
.zone b{font-size:15px;line-height:1.25}
.zone small{color:var(--muted);font-weight:600}
.zone.on{background:var(--navy);color:#fff}
.zone.on small{color:#c8d4e6}
.zone.on .n{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:right;width:100%}
.li .ic{width:46px;height:46px;border-radius:10px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 auto;font-family:var(--display);color:var(--navy);font-size:18px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block}
.li .tx small{color:var(--muted)}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.todo{background:var(--brass-soft);color:#6b4a12}
.pill.lock{background:var(--paper-2);color:var(--muted)}
.li.locked{opacity:.6}
.section-title{font-family:var(--display);font-size:20px;color:var(--navy);margin-top:6px}
.bar{height:10px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:999px}
.stamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stampc{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);color:var(--muted);font-size:18px}
.stampc.on{border:2px solid var(--stamp);color:var(--stamp);background:#fbeee9;transform:rotate(-8deg)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.note{background:#fff8dc;border:1px solid #ecd9a0;border-radius:4px 4px 12px 4px;padding:10px;font-size:15px;box-shadow:0 1px 0 #ecd9a0}
.note b{display:block;font-size:13px;color:#8a6a1e}
.note.empty{background:transparent;border-style:dashed;color:var(--muted);box-shadow:none}
.seg{display:flex;background:var(--paper-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.demo{font-size:13px;color:var(--muted);text-align:center}

/* world */
#world{position:fixed;inset:0;z-index:20;background:#2b4a2a;direction:rtl;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.hbtn{background:rgba(25,32,44,.88);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px;min-height:44px}
.goal{background:rgba(255,250,240,.96);border-radius:14px;padding:8px 14px;text-align:center;flex:0 1 300px;min-width:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.goal small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.goal b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gl{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:700;color:#6b4a12}
.goal .bar{flex:1;height:7px}
.compass{position:absolute;top:calc(env(safe-area-inset-top,0px) + 96px);right:max(14px,env(safe-area-inset-right,0px));width:52px;height:52px;border-radius:50%;background:rgba(25,32,44,.85);border:2px solid #6fc7b5;display:grid;place-items:center}
.compass svg{width:26px;height:26px;transition:transform .15s linear}
.compass{padding:0;color:#fff}.compass span{position:absolute;top:100%;margin-top:3px;font-size:12px;font-weight:800;background:rgba(25,32,44,.85);border-radius:6px;padding:0 6px;white-space:nowrap}
.joy{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:140px;height:140px;border-radius:50%;background:rgba(25,32,44,.35);border:2px solid rgba(255,255,255,.25)}
.joy.left{left:max(18px,env(safe-area-inset-left,0px))}
.joy.right{right:max(18px,env(safe-area-inset-right,0px))}
.joy i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#f3ead6;border:4px solid var(--navy-2)}
.joy.big{width:170px;height:170px}
.act{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:104px;height:104px;border-radius:50%;background:#2a7a6c;color:#fff;border:4px solid #8fd8c8;font-family:var(--display);font-size:21px;line-height:1.1;padding:6px;box-shadow:0 4px 0 #1b5249}
.act.left{left:max(22px,env(safe-area-inset-left,0px))}
.act.right{right:max(22px,env(safe-area-inset-right,0px))}
.dpad{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:168px;height:168px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;direction:ltr}
.dpad.left{left:max(14px,env(safe-area-inset-left,0px))}.dpad.right{right:max(14px,env(safe-area-inset-right,0px))}
.dpad button{border:0;border-radius:12px;background:#fffaf0;color:var(--navy);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:none}
.dpad button.on{background:var(--brass-soft);transform:translateY(2px);box-shadow:none}
.dpad [data-d=up]{grid-area:1/2}.dpad [data-d=left]{grid-area:2/1}.dpad [data-d=right]{grid-area:2/3}.dpad [data-d=down]{grid-area:3/2}
.dpad.big{width:200px;height:200px}
.gear{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:52px;height:52px;border-radius:50%;border:0;background:rgba(25,32,44,.85);color:#fff;font-size:24px}
.gear.left{left:max(48px,env(safe-area-inset-left,0px))}.gear.right{right:max(48px,env(safe-area-inset-right,0px))}
.minimap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 122px);left:max(10px,env(safe-area-inset-left,0px));width:min(46vw,250px);aspect-ratio:4/3;border-radius:12px;border:3px solid #6fc7b5;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);background:#2b4a2a}
.minimap canvas{width:100%;height:100%;display:block}
.minib{position:absolute;bottom:4px;right:4px;width:34px;height:34px;border-radius:8px;border:0;background:rgba(25,32,44,.85);color:#fff;font-size:18px}
.minit{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:rgba(25,32,44,.85);color:#fff;border-radius:0 0 6px 6px;padding:0 6px;font-size:12px;font-weight:800}
.sheet{position:absolute;inset:0;background:rgba(15,20,28,.45);display:flex;align-items:flex-end;z-index:6}
.sheet-in{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto;direction:rtl}
.sheet-h{display:flex;justify-content:space-between;align-items:center}.sheet-h h3{font-size:24px;color:var(--navy)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;z-index:3}
.dlg{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:640px;margin:0 auto;background:var(--card);border:4px solid #1d2430;border-radius:16px;padding:16px 18px;box-shadow:0 0 0 3px var(--card),0 8px 24px rgba(0,0,0,.35);z-index:4}
.dlg .who{font-family:var(--display);color:#2a7a6c;font-size:18px}
.dlg p{margin:6px 0 12px;font-size:18px}
.dlg .row{justify-content:flex-start}
.mapov{position:absolute;inset:0;background:rgba(15,20,28,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.mapov{overflow-y:auto;justify-content:flex-start}
.maplist{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;direction:rtl}
.mlhint{color:#dfe7f3;margin:0;font-size:14px;text-align:center}
.mlrow{display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:12px;padding:10px 12px;text-align:right;width:100%}
.mlrow.locked{opacity:.65}
.mln{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#7a6f5c;color:#fff;flex:0 0 auto}
.mln.u{background:var(--navy)}.mln.d{background:var(--good)}
.mlt{flex:1;min-width:0}.mlt b{display:block}.mlt small{color:var(--muted)}
.mapov canvas{max-width:100%;max-height:42vh;image-rendering:pixelated;border:4px solid #f3ead6;border-radius:8px}
.mapov h3{color:#fff}
.nbov{justify-content:flex-start;overflow-y:auto}
.nbbox{background:var(--paper);border-radius:16px;padding:16px;width:100%;max-width:560px;direction:rtl}
.nbbox h3{color:var(--navy);font-size:24px;margin-bottom:6px}
.nbintro{margin:0 0 12px;font-size:16px}

/* case file (lesson) */
#case{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;direction:rtl}
.case-top{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.case-top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.case-top .t{flex:1;min-width:0}
.case-top .t small{display:block;color:#c8d4e6;font-weight:700;font-size:13px}
.case-top .t b{display:block;font-family:var(--display);font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
.steps{display:flex;gap:6px;padding-bottom:10px}
.steps i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.22)}
.steps i.on{background:#f4c26b}
.folder{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:18px;position:relative;margin-top:22px}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;right:-1px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:2px 14px;font-weight:800;font-size:13px;color:var(--brass)}
.npc-line{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.npc-line canvas{width:48px;height:64px;image-rendering:pixelated;flex:0 0 auto;background:var(--paper-2);border-radius:10px}
.npc-line .bub{background:var(--paper);border-radius:12px;padding:10px 12px;flex:1;min-width:0}
.npc-line .bub b{color:#2a7a6c;font-family:var(--display);font-weight:400}
.q{font-size:20px;font-weight:700;margin:4px 0 14px}
.lvl{display:inline-block;background:var(--brass-soft);color:#6b4a12;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;text-align:right;font-size:18px;font-weight:600;min-height:52px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.right{color:var(--ink);border-color:var(--good);background:var(--good-soft)}
.opt.wrong{color:var(--ink);border-color:var(--bad);background:var(--bad-soft)}
.sent{display:flex;flex-wrap:wrap;gap:8px;font-size:22px;line-height:1.3;margin-bottom:6px}
.sent.grid{gap:10px}
.tok{border:2px dashed transparent;background:var(--paper);border-radius:10px;padding:6px 10px;font-weight:600;font-size:21px}
.sent.grid .tok{border:2px solid var(--line);background:var(--card);min-width:84px}
.sent .tok[aria-pressed="true"]{border:2px solid var(--navy);background:var(--navy);color:#fff;box-shadow:0 3px 0 #0f1a2b;transform:translateY(-2px)}
.sent .tok[aria-pressed="true"]::before,.opt[aria-pressed="true"]::before{content:"✓ ";font-weight:800}
.sent .tok.right{color:var(--ink);transform:none;box-shadow:none;border:2px solid var(--good);background:var(--good-soft)}
.sent .tok.wrong{color:var(--ink);transform:none;box-shadow:none;border:2px solid var(--bad);background:var(--bad-soft)}
.sent .tok.missed{border:2px dashed var(--good);background:var(--card)}
.sortw{display:flex;flex-direction:column;gap:12px}
.sortw .cur{align-self:center;font-size:30px;font-weight:800;background:#fff8dc;border:2px solid #ecd9a0;border-radius:12px;padding:10px 26px;min-width:150px;text-align:center}
.bins{display:grid;gap:10px}
.bin{border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:10px;min-height:96px;display:flex;flex-direction:column;gap:6px;text-align:right}
.bin>b{font-family:var(--display);font-weight:400;color:var(--navy);font-size:18px}
.bin .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-weight:700}
.chip.right{background:var(--good-soft);border-color:var(--good)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:17px}
.fb.ok{background:var(--good-soft);color:#1d5233}
.fb.no{background:var(--bad-soft);color:#7a1f19}
.fb b{font-family:var(--display);font-weight:400;font-size:19px;display:block}
.hint{margin-top:12px;background:#fff8dc;border:1px dashed #d9b85a;border-radius:12px;padding:10px 12px;font-size:16px}
.case-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.case-actions .btn{flex:1 1 150px}
.teach h3{font-size:24px;color:var(--navy);margin-bottom:8px}
.teach p{margin:6px 0}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ex span{background:var(--paper);border-radius:10px;padding:6px 12px;font-weight:700;font-size:19px}
.ex span.no{background:var(--bad-soft);text-decoration:line-through}
.ex span.yes{background:var(--good-soft)}
.flow{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.flow div{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:18px}
.flow div i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.tbl{width:100%;border-collapse:collapse;font-size:17px;margin:8px 0}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tbl th{background:var(--paper-2)}
.result{text-align:center;padding-top:10px}
.result .score{font-family:var(--display);font-size:64px;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}

<script>
"use strict";
/* ============ storage ============ */
const KEY="sochnut-v1";
const ONLINE_MODE=!!window.SOCHNUT_CONFIG;
const demoNote=()=>ONLINE_MODE?(window.ONLINE_ME?"":"מצב ניסיון: ההתקדמות נשמרת רק בדפדפן הזה."):"גרסת הדגמה: ההתקדמות נשמרת בדפדפן הזה בלבד.";
const fresh=()=>({name:"",coat:0,points:0,solved:{},clues:[],planks:0,review:[],level:{},tutorial:false,gateSeen:false,chest:false,stars:[],words:{},spaced:[],skill:{},spent:0,owned:["o0"],outfit:"o0",wk:"",wkPts:0,settings:{side:"left",big:false,ctrl:"joy",mini:true},pos:null,teacher:{gate:"auto",unlockAll:false,tts:false},zoneExam:null});
let P=fresh();
function load(){try{const s=localStorage.getItem(KEY);if(s)P=Object.assign(fresh(),JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
load();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ ranks ============ */
const PASS=80;
/* ===== נקודות (וגם מטבעות לחנות). משנים כאן בלבד ===== */
const PTS={q:[1,2,3],case:10,perfect:5,clue:2,star:{1:5,2:10,3:20},zone:15,spaced:1,exam:1,bridge:1,chest:5};
const PERFECT_BONUS=PTS.perfect;
function weekStart(d){d=new Date(d||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10);}
function addPts(n){n=Math.max(0,Math.round(n));if(!n)return;P.points+=n;const w=weekStart();if(P.wk!==w){P.wk=w;P.wkPts=0;}P.wkPts=(P.wkPts||0)+n;}
const coins=()=>Math.max(0,P.points-(P.spent||0));
const RANKS=[[0,"בלש מתלמד"],[40,"בלש"],[120,"בלש ראשי"],[250,"מפקד הסוכנות"]];
function rank(){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(P.points>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null;}}return{name:r[1],from:r[0],next:nx};}

/* ============ content ============ */
const ZONES=[
 {n:"1",name:"רובע המילים",topic:"שם עצם · שם תואר · פועל · ניקוד"},
 {n:"2",name:"גן השורשים",topic:"שורשים · מילון · פירושי מילים"},
 {n:"3",name:"מגדל הקורא הפעיל",topic:"בקרה · עוצר ושואל · פיצוח שאלה"},
 {n:"4",name:"הארכיון",topic:"איתור מידע · מאזכרים"},
 {n:"5",name:"חדר החקירות",topic:"הסקת מסקנות · מסר"},
 {n:"6",name:"מערכת העיתון",topic:"מגירות · ויכוח · שיפוט"},
 {n:"★",name:"השמורה",topic:"חזרה על הכול"}
];
const COATS=[["#8a5a2b","#6d4522"],["#2f5d8a","#244a6e"],["#3f7a45","#2f5e35"],["#7a3b52","#5e2d3f"]];

let screen="home",prevScreen="home";
function go(s){

function isDone(l){return !!(P.solved[l.id]&&P.solved[l.id].done);}
function unlocked(l){const i=LESSONS.indexOf(l);return i<=0||isDone(LESSONS[i-1])||P.teacher.unlockAll;}
function orderText(){return LESSONS.map((l,i)=>`${i+1}. ${l.building}`).join(" ← ");}
function lockMsg(l){const prev=LESSONS[LESSONS.indexOf(l)-1];return `${l.building} עדיין נעול. הוא נפתח אחרי שמפענחים את ${prev.building}.\nהסדר ברובע: ${orderText()}`;}
function solvedCount(){return LESSONS.filter(l=>P.solved[l.id]&&P.solved[l.id].done).length;}
function nextLesson(){return LESSONS.find(l=>!(P.solved[l.id]&&P.solved[l.id].done))||null;}

function render(){
  document.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===screen?"page":"false"));
  $("#avatarBtn").textContent=(P.name||"ב").trim().charAt(0);
  const el=$("#screen");
  if(screen==="home")el.innerHTML=homeHTML();
  else if(screen==="cases")el.innerHTML=casesHTML();
  else if(screen==="exam")el.innerHTML=examHTML();
  else if(screen==="teacher")el.innerHTML=teacherHTML();
  else if(screen==="class"){el.innerHTML=classHTML();fillBoard();}
  else if(screen==="shop")el.innerHTML=shopHTML();
  else el.innerHTML=meHTML();
  bindScreen();
}

function rect(x0,y0,x1,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setT(x,y,v);}
function buildMap(){
  map=[];for(let y=0;y<MH;y++){map.push([]);for(let x=0;x<MW;x++)map[y].push("g");}
  rect(0,0,MW-1,1,"t");rect(0,0,1,MH-1,"t");rect(MW-2,0,MW-1,MH-1,"t");rect(0,MH-1,MW-1,MH-1,"w");
  // river + bridges
  rect(0,25,MW-1,27,"w");rect(9,25,10,27,"b");rect(34,25,35,27,P.planks>=5?"b":"k");
  // island area (south east) surrounded by water
  rect(24,28,25,MH-1,"w");rect(26,34,MW-1,MH-1,"w");
  // paths
  rect(3,20,42,20,"p");rect(22,9,23,24,"p");rect(9,20,10,24,"p");rect(34,20,35,24,"p");
  rect(9,28,10,32,"p");rect(34,28,35,30,"p");rect(29,31,40,31,"p");
  // plaza
  rect(16,10,29,17,"c");rect(22,13,23,14,"f");
  // building doors paths
  rect(8,13,15,13,"p");rect(30,13,37,13,"p");rect(8,19,8,19,"p");rect(13,7,13,9,"p");rect(13,9,17,9,"p");rect(37,19,37,19,"p");
  // zone-2 fence with gate
  rect(2,30,22,30,"F");rect(9,30,10,30,"G");rect(2,31,22,33,"z");
  buildings=[
   {x:19,y:4,w:8,h:5,name:"מטה הסוכנות",roof:"#7a2a22",hq:true,door:{x:22,y:8}},
   {x:5,y:8,w:7,h:5,name:"בית החפצים",roof:"#3d5f8a",lesson:"noun",door:{x:8,y:12}},
   {x:34,y:8,w:7,h:5,name:"סדנת הצבעים",roof:"#b8642a",lesson:"adj",door:{x:37,y:12}},
   {x:10,y:2,w:7,h:5,name:"אולם הפעולות",roof:"#3f7a45",lesson:"verb",door:{x:13,y:6}},
   {x:5,y:14,w:7,h:5,name:"תחנת המיון",roof:"#5e4a7a",lesson:"sort3",door:{x:8,y:18}},
   {x:34,y:14,w:7,h:5,name:"בית הניקוד",roof:"#2f6b63",lesson:"nikud",door:{x:37,y:18}}];
  buildings.forEach(b=>rect(b.x,b.y,b.x+b.w-1,b.y+b.h-1,"B"));
  setT(22,9,"p");setT(23,9,"p");
  // trees
  for(let y=2;y<MH-1;y++)for(let x=2;x<MW-2;x++){if(map[y][x]!=="g")continue;
    const near=(dx,dy)=>{const v=(map[y+dy]||[])[x+dx];return v&&v!=="g"&&v!=="t";};
    let block=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(near(dx,dy))block=true;
    if(!block&&hash(x,y,3)>.86)map[y][x]="t";}
  CLUES.forEach(c=>{map[c.y][c.x]="g";});STARS.forEach(c=>{map[c.y][c.x]="g";});
  setT(12,21,"s");setT(11,29,"s");setT(36,24,"g");setT(33,24,"s");
  npcs=[
   {id:"chief",name:"המפקד",x:21,y:10.2,colors:["#22344f","#16243a"]},
   {id:"crier",name:"הכרוז",x:24.8,y:19.3,colors:["#8a3b2a","#6a2c1f"]},
   {id:"fisher",name:"הדייג",x:31.5,y:23.6,colors:["#4f6b3a","#3a5229"]},
   ...LESSONS.map(l=>{const b=buildings.find(b=>b.lesson===l.id);return{id:"l_"+l.id,name:l.npc,x:b.door.x-1.6,y:b.door.y+1.3,colors:l.npcColors,lesson:l.id};})];
  bake();
}
function bake(){
  mapCv=document.createElement("canvas");mapCv.width=MW*T;mapCv.height=MH*T;const c=mapCv.getContext("2d");
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const v=map[y][x],ox=x*T,oy=y*T;
    if(v==="g"||v==="B")drawGrass(c,ox,oy,x,y);
    else if(v==="z")drawGrass(c,ox,oy,x,y,true);
    else if(v==="p")drawPath(c,ox,oy,x,y);
    else if(v==="c")drawCobble(c,ox,oy,x,y);
    else if(v==="w")drawWater(c,ox,oy,x,y);
    else if(v==="b"){drawBridge(c,ox,oy);drawRails(c,ox,oy,x===9||x===34);}
    else if(v==="k"){drawWater(c,ox,oy,x,y);drawRails(c,ox,oy,x===34);}
    else if(v==="t")drawTree(c,ox,oy,x,y);
    else if(v==="F")drawFence(c,ox,oy,x,y);
    else if(v==="G")drawPath(c,ox,oy,x,y);
    else if(v==="f")drawCobble(c,ox,oy,x,y);
    else if(v==="s"){drawGrass(c,ox,oy,x,y);drawSign(c,ox,oy);}}
  // river banks
  c.fillStyle="#7d6a4a";for(let x=0;x<MW;x++){if(map[24][x]!=="p")c.fillRect(x*T,25*T-2,T,2);if(map[28]&&map[28][x]!=="p"&&map[28][x]!=="w")c.fillRect(x*T,28*T,T,2);}
  // fountain
  c.fillStyle="#7f8693";c.beginPath();c.arc(23*T,14*T,15,0,7);c.fill();c.fillStyle="#4c8db3";c.beginPath();c.arc(23*T,14*T,11,0,7);c.fill();c.fillStyle="#9a9fab";c.fillRect(23*T-3,14*T-8,6,12);c.fillStyle="#bfe3f2";c.fillRect(23*T-1,14*T-12,2,5);
  // big tree in zone 2
  c.fillStyle="#5a3a22";c.fillRect(16*T,31*T,10,26);c.fillStyle="#2c6131";c.beginPath();c.arc(16*T+5,31*T,22,0,7);c.fill();c.fillStyle="#3d7f42";c.beginPath();c.arc(16*T-2,31*T-6,12,0,7);c.fill();
  buildings.forEach(b=>drawBuilding(c,b));
  // chest on island
  if(!P.chest)drawChest(c,37*T,29*T);
}
function drawChest(c,x,y){px(c,x+2,y+5,12,9,"#8a5a35");px(c,x+2,y+3,12,4,"#a86d3c");px(c,x+2,y+8,12,1,"#4a2f1b");px(c,x+7,y+7,2,3,"#f4c26b");}
function drawBuilding(c,b){
  const X=b.x*T,Y=b.y*T,W=b.w*T,H=b.h*T,roofH=2*T;
  c.fillStyle="rgba(0,0,0,.18)";c.fillRect(X+3,Y+H-2,W,4);
  px(c,X,Y+roofH,W,H-roofH,"#ddd3c0");
  c.fillStyle="#c9bea8";for(let r=Y+roofH+3;r<Y+H;r+=5)c.fillRect(X,r,W,1);
  for(let r=0,yy=Y+roofH;yy<Y+H;r++,yy+=5)for(let xx=X+(r%2)*6;xx<X+W;xx+=12)c.fillRect(xx,yy,1,5);
  px(c,X-2,Y+roofH-2,W+4,4,"#2b2320");
  px(c,X,Y,W,roofH,b.roof);c.fillStyle="rgba(0,0,0,.18)";for(let r=4;r<roofH;r+=5)c.fillRect(X,Y+r,W,1);
  c.fillStyle="rgba(255,255,255,.12)";c.fillRect(X,Y,W,2);
  const winY=Y+roofH+8;
  for(let i=0;i<b.w;i++){const wx=X+i*T+4;if(i===b.door.x-b.x)continue;if(i%2===1||b.w<6){px(c,wx-1,winY-1,10,9,"#5a3a22");px(c,wx,winY,8,7,"#7fb6d6");px(c,wx+3,winY,1,7,"#5a3a22");px(c,wx,winY+3,8,1,"#5a3a22");}}
  const dx=b.door.x*T,dy=Y+H-14;px(c,dx+1,dy-2,14,16,"#3a2618");px(c,dx+3,dy,10,14,"#7a4a28");px(c,dx+10,dy+7,2,2,"#f4c26b");
  if(b.hq){px(c,X+W-12,Y-10,2,12,"#2b2320");px(c,X+W-10,Y-10,8,5,"#f4c26b");}
}
function drawChar(c,x,y,col,frame,s){
  s=s||1;const P_=["...hhhhhh...","..hhhhhhhh..","..HHHHHHHH..","hhhhhhhhhhhh","...ssssss...","...sesses...","...ssssss...","..cccccccc..",".cccCccCccc.",".ccccCCcccc.",".scccCCcccs.","..cccccccc..","..pppppppp..",frame?"..pp...pp...":"...pp..pp...",frame?"..pp...pp...":"...pp..pp...",frame?"..bb...bb...":"...bb..bb..."];
  const m={h:col.hat,H:col.band,s:col.skin,e:"#1d1d1d",c:col.coat,C:col.coatD,p:col.pants,b:col.boots};
  for(let r=0;r<16;r++)for(let k=0;k<12;k++){const ch=P_[r][k];if(ch!=="."){c.fillStyle=m[ch];c.fillRect(x+k*s,y+r*s,s,s);}}
  if(col.acc){const a=col.accent||"#f4c26b",d=(k,r,w,h,cl)=>{c.fillStyle=cl;c.fillRect(x+k*s,y+r*s,w*s,h*s);};
    col.acc.forEach(t=>{
      if(t==="tie"){d(5,7,2,1,a);d(5,8,2,2,a);d(5,10,2,1,col.coatD);}
      if(t==="shades"){d(3,5,3,1,"#111");d(6,5,3,1,"#111");}
      if(t==="glasses"){d(3,5,6,1,"#c9a26b");d(4,5,1,1,"#1d1d1d");d(7,5,1,1,"#1d1d1d");}
      if(t==="scarf"){d(2,7,8,1,a);d(7,8,1,2,a);}
      if(t==="badge"){d(3,8,1,1,a);d(3,9,1,1,"#c08a2d");}
      if(t==="belt"){d(2,11,8,1,"#2b2320");d(5,11,2,1,a);}
      if(t==="epaulets"){d(1,8,2,1,a);d(9,8,2,1,a);}
      if(t==="collar"){d(2,7,1,1,a);d(9,7,1,1,a);d(1,8,1,1,a);d(10,8,1,1,a);}});}
}
function npcCol(n){return{hat:"#2b2320",band:"#3a3a3a",skin:"#e8bf96",coat:n.colors[0],coatD:n.colors[1],pants:"#33363f",boots:"#1c1c1c"};}

/* ============ world ============ */
const cv=$("#cv"),ctx=cv.getContext("2d");
let W=0,H=0,S=3,DPR=1,running=false,last=0,t0=0;
const pl={x:22.5,y:11.2,f:0,moving:false,anim:0};
const input={x:0,y:0};const keys={};
let dlgAt=0,dlgOpen=false,nearObj=null,toastT=0,mapOpen=false;

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const base=Math.min(W,H);S=Math.max(2,Math.min(4,Math.round(base/(T*11))));if(P.settings.big)S+=1;}
window.addEventListener("resize",()=>{if(running)resize();});

function openWorld(){
  if(!mapCv)buildMap();
  $("#world").hidden=false;document.body.style.overflow="hidden";
  if(P.pos){pl.x=P.pos.x;pl.y=P.pos.y;}
  applyControls();
  resize();running=true;last=performance.now();requestAnimationFrame(loop);updateHud();
  if(!P.tutorial){setTimeout(()=>talk(npcs.find(n=>n.id==="chief")),350);}
}
function applyControls(){const st=P.settings,side=st.side||"left",other=side==="left"?"right":"left",arrows=st.ctrl==="arrows";
  $("#joy").className="joy "+side+(st.big?" big":"");$("#joy").hidden=arrows;$("#dpad").className="dpad "+side+(st.big?" big":"");$("#dpad").hidden=!arrows;
  $("#actBtn").className="act "+other;$("#gearBtn").className="gear "+other;$("#mini").hidden=st.mini===false;
  document.querySelectorAll("#sheet [data-set]").forEach(b=>{const [k,v]=b.dataset.set.split(":");const cur=k==="big"?(st.big?"1":"0"):k==="mini"?(st.mini===false?"0":"1"):(k==="ctrl"?(st.ctrl||"joy"):st[k]);b.setAttribute("aria-pressed",String(cur===v));});
  resize();}
function closeWorld(){running=false;P.pos={x:pl.x,y:pl.y};save();$("#world").hidden=true;document.body.style.overflow="";closeDlg();screen="home";render();}
$("#exitBtn").addEventListener("click",closeWorld);

function solid(tx,ty){const v=(map[ty]||[])[tx];if(v===undefined)return true;
  if(v==="G")return !gateOpen();return "wtBFkf".includes(v)||v==="s";}
function missingList(){return LESSONS.filter(l=>!(P.solved[l.id]&&P.solved[l.id].done)).map(l=>l.building).join(", ");}
function starReady(st){return st.req.every(id=>isDone(L(id)));}
function gateOpen(){const g=P.teacher.gate;if(g==="open")return true;if(g==="locked")return false;return solvedCount()>=LESSONS.length&&!!(P.zoneExam&&P.zoneExam.passed);}
function blocked(x,y){const r=.28;for(const[dx,dy]of[[-r,-.05],[r,-.05],[-r,.3],[r,.3]]){if(solid(Math.floor(x+dx),Math.floor(y+dy)))return true;}
  for(const n of npcs){if(Math.abs(n.x-x)<.5&&Math.abs(n.y-y)<.35)return true;}return false;}

function loop(now){
  if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;t0+=dt;
  let ix=input.x,iy=input.y;if(dp.left||dp.right||dp.up||dp.down){ix=(dp.right?1:0)-(dp.left?1:0);iy=(dp.down?1:0)-(dp.up?1:0);}
  if(keys.ArrowLeft||keys.a)ix=-1;if(keys.ArrowRight||keys.d)ix=1;if(keys.ArrowUp||keys.w)iy=-1;if(keys.ArrowDown||keys.s)iy=1;
  const mag=Math.hypot(ix,iy);pl.moving=false;
  if(mag>.15&&!dlgOpen&&!mapOpen){const sp=4.2*dt/Math.max(1,mag);const nx=pl.x+ix*sp,ny=pl.y+iy*sp;
    if(!blocked(nx,pl.y))pl.x=nx;if(!blocked(pl.x,ny))pl.y=ny;pl.moving=true;pl.anim+=dt*8;}
  checkNear();draw();drawMini();
  if(toastT>0){toastT-=dt;if(toastT<=0)$("#toast").hidden=true;}
  requestAnimationFrame(loop);
}
function interactables(){
  const arr=[];
  buildings.forEach(b=>arr.push({kind:"door",x:b.door.x+.5,y:b.door.y+1.2,b,label:"כניסה"}));
  npcs.forEach(n=>arr.push({kind:"npc",x:n.x,y:n.y,n,label:"לדבר"}));
  CLUES.forEach(c=>{if(!P.clues.includes(c.id))arr.push({kind:"clue",x:c.x+.5,y:c.y+.5,c,label:clueReady(c)?"לקרוא":"🔒 רמז"});});
  if(P.planks<5)arr.push({kind:"bridge",x:35,y:24.4,label:"לתקן"});
  arr.push({kind:"gate",x:10,y:29.3,label:gateOpen()?"לעבור":"לבדוק"});
  STARS.forEach(st=>{if(!P.stars.includes(st.id))arr.push({kind:"star",x:st.x+.5,y:st.y+.6,st,label:starReady(st)?"אתגר ★":"🔒 ★"});});
  if(!P.chest)arr.push({kind:"chest",x:37.5,y:29.9,label:"לפתוח"});
  [[12,21,"רובע המילים · דרום: הנהר והגשרים · צפון: מטה הסוכנות"],[11,29,"גן השורשים · אזור 2"],[33,24,"גשר המילים · כל קרש הוא תשובה נכונה"]].forEach(s=>arr.push({kind:"sign",x:s[0]+.5,y:s[1]+1.1,text:s[2],label:"לקרוא"}));
  return arr;
}
function checkNear(){
  if(dlgOpen||mapOpen){$("#actBtn").hidden=true;nearObj=null;return;}
  let best=null,bd=1.15;
  for(const o of interactables()){const d=Math.hypot(o.x-pl.x,o.y-pl.y);if(d<bd){bd=d;best=o;}}
  nearObj=best;const ab=$("#actBtn");if(best){ab.hidden=false;if(ab.dataset.l!==best.label){ab.dataset.l=best.label;ab.innerHTML=esc(best.label)+(matchMedia("(pointer:fine)").matches?'<small style="display:block;font-family:var(--body);font-size:12px;opacity:.85">Enter</small>':"");}}else ab.hidden=true;
}
function act(){const o=nearObj;if(!o||dlgOpen)return;
  if(o.kind==="door"){if(o.b.hq)say("המפקד","המטה סגור כרגע לשיפוצים. המפקד מחכה לכם בכיכר.");else openCase(o.b.lesson,"world");}
  else if(o.kind==="npc")talk(o.n);
  else if(o.kind==="bridge")bridgePuzzle();
  else if(o.kind==="gate"){if(P.teacher.gate!=="locked"&&P.teacher.gate!=="open"&&solvedCount()>=LESSONS.length&&!(P.zoneExam&&P.zoneExam.passed)){examIntro();return;}if(P.teacher.gate==="locked")say("שומר השער","המורה נעל את השער לזמן מה, כדי שכל הכיתה תתקדם יחד. בינתיים אפשר לחזור על התיקים ולאסוף דפי רמז.");else if(gateOpen())say("שומר השער","השער פתוח! גן השורשים עדיין בבנייה. בקרוב תוכלו להיכנס ולגלות את סוד עץ המילים.");else say("שומר השער",`השער לגן השורשים נפתח רק אחרי שמפענחים את כל ${LESSONS.length} התיקים ברובע המילים, כל אחד מ־${PASS}%. פוענחו עד עכשיו: ${solvedCount()}. עוד חסרים: ${missingList()}.`);}
  else if(o.kind==="clue"){const c=o.c;if(!clueReady(c))say("דף רמז נעול",`הדף הזה שייך לנושא ״${L(c.l).title}״. הוא ייפתח אחרי שתלמדו ותפענחו את ${L(c.l).building}, כי רק אז הוא יעזור לכם באמת.`);else openClue(c);}
  else if(o.kind==="chest")openChest();
  else if(o.kind==="star"){const st=o.st;if(!starReady(st))say("כוכב אתגר נעול",`${st.title}\nשווה ${st.pts} נקודות. הכוכב נפתח אחרי שמפענחים: ${st.req.map(id=>L(id).building).join(", ")}.\nעוד חסרים: ${st.req.filter(id=>!isDone(L(id))).map(id=>L(id).building).join(", ")}.`);
    else say("כוכב אתגר!",`${st.title}\nשאלת אתגר על מה שכבר למדתם, ששווה ${st.pts} נקודות. צריך לענות נכון על הכול כדי לאסוף את הכוכב. אם לא הצלחתם, אפשר לחזור ולנסות שוב.`,[{t:"לנסות את האתגר",f:()=>openChallenge(st)},{t:"אחר כך"}]);}
  else if(o.kind==="sign")say("שלט",o.text);
}
$("#actBtn").addEventListener("click",act);
window.addEventListener("keydown",e=>{if(!$("#case").hidden){caseKey(e);return;}if(!$("#onb").hidden||$("#world").hidden)return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  const ts=T*S;let camX=pl.x*ts-W/2,camY=pl.y*ts-H/2;
  camX=Math.max(0,Math.min(MW*ts-W,camX));camY=Math.max(0,Math.min(MH*ts-H,camY));
  if(MW*ts<W)camX=(MW*ts-W)/2;if(MH*ts<H)camY=(MH*ts-H)/2;
  ctx.fillStyle="#2b4a2a";ctx.fillRect(0,0,W,H);
  ctx.drawImage(mapCv,Math.round(camX/S),Math.round(camY/S),Math.ceil(W/S)+1,Math.ceil(H/S)+1,0,0,(Math.ceil(W/S)+1)*S,(Math.ceil(H/S)+1)*S);

      if(i<P.planks){ctx.fillStyle="#8a5a35";ctx.fillRect(X,Y,26*S,7*S);ctx.fillStyle="#6a4327";ctx.fillRect(X,Y+6*S,26*S,S);}
      else{ctx.strokeStyle="rgba(255,255,255,.5)";ctx.setLineDash([3*S,3*S]);ctx.lineWidth=S;ctx.strokeRect(X+S,Y+S,24*S,5*S);ctx.setLineDash([]);}}}
  // gate

  // clues
  CLUES.forEach(c=>{if(P.clues.includes(c.id))return;const rd=clueReady(c);ctx.globalAlpha=rd?1:.45;const bob=rd?Math.sin(t0*3+c.x)*2*S:0;const X=sx(c.x)+3*S,Y=sy(c.y)+2*S+bob;
    ctx.fillStyle="rgba(0,0,0,.2)";ctx.fillRect(X+S,sy(c.y)+14*S,9*S,2*S);ctx.fillStyle="#fff8dc";ctx.fillRect(X,Y,10*S,12*S);ctx.fillStyle="#c9a26b";ctx.fillRect(X+2*S,Y+3*S,6*S,S);ctx.fillRect(X+2*S,Y+6*S,5*S,S);ctx.fillStyle="#b8322a";ctx.fillRect(X+6*S,Y+8*S,2*S,2*S);
    if(rd&&Math.sin(t0*5+c.y)>.6){ctx.fillStyle="#fff";ctx.fillRect(X+10*S,Y-2*S,2*S,2*S);}ctx.globalAlpha=1;});
  // challenge stars
  STARS.forEach(st=>{if(P.stars.includes(st.id))return;const ready=starReady(st);const X=sx(st.x)+8*S,Y=sy(st.y)+7*S+(ready?Math.sin(t0*3+st.x)*1.5*S:0);
    ctx.save();ctx.translate(X,Y);const R=(5+st.tier)*S;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?R*.45:R;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();
    ctx.fillStyle="#ffd21f";ctx.globalAlpha=ready?1:.8;ctx.fill();ctx.lineWidth=1.5*S;ctx.strokeStyle="#5a3d00";ctx.stroke();ctx.globalAlpha=1;if(!ready){ctx.fillStyle="#2b2b2b";ctx.fillRect(-2.5*S,-.5*S,5*S,4*S);ctx.strokeStyle="#2b2b2b";ctx.lineWidth=S;ctx.beginPath();ctx.arc(0,-.5*S,1.8*S,Math.PI,0);ctx.stroke();}
    if(ready&&Math.sin(t0*4+st.y)>.5){ctx.fillStyle="#fff";ctx.fillRect(R*.6,-R,2*S,2*S);}ctx.restore();});

  $("#compass").hidden=Math.hypot(tg.x-pl.x,tg.y-pl.y)<2;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawShadow(X,Y){ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(X,Y+S,5*S,2*S,0,0,7);ctx.fill();}
function target(){
  if(P.navTo){const l=L(P.navTo);if(l&&!isDone(l)&&unlocked(l)){const b=buildings.find(b=>b.lesson===l.id);return{x:b.door.x+.5,y:b.door.y+1.2,name:b.name};}P.navTo=null;}
  if(!P.tutorial){const c=npcs.find(n=>n.id==="chief");return{x:c.x,y:c.y,name:"המפקד בכיכר"};}
  const nl=nextLesson();if(nl){const b=buildings.find(b=>b.lesson===nl.id);return{x:b.door.x+.5,y:b.door.y+1.2,name:b.name};}

function talk(n){
  if(n.id==="chief"){
    if(!P.tutorial){chain("המפקד",[`ברוכים הבאים לסוכנות הבלשים, בלש ${P.name}!`,"זה רובע המילים. בכל בניין כאן מחכה תיק חקירה, ובכל תיק לומדים כלי בלשי חדש.","בשטח פזורים 8 דפי רמז. כל דף שייך לנושא, והוא נפתח רק אחרי שלומדים את הבית שלו. קוראים את הדף, עונים על שאלה קטנה, והדף נשמר במחברת הבלש (הכפתור ״מחברת״ למעלה).","החץ הירוק מראה לאן ללכת. התיק הראשון מחכה בבית החפצים. בהצלחה!"],()=>{P.tutorial=true;save();updateHud();});return;}
    const sc=solvedCount();
    if(sc<LESSONS.length)say("המפקד",`פוענחו ${sc} מתוך ${LESSONS.length} תיקים. התיק הבא: ${target().name}. תיק נחשב פוענח מ־${PASS}%. כדי לפתוח את השער לאזור הבא צריך לפענח את כל התיקים ברובע.`);
    else say("המפקד","כל התיקים ברובע המילים פוענחו! קיבלתם את חותמת א׳. השער לגן השורשים פתוח.");return;}
  if(n.id==="crier"){chain("הכרוז",[`ברובע המילים פותרים את התיקים לפי הסדר. כל בית נפתח אחרי שמפענחים את הקודם:\n${orderText()}`,"שתי דרכים מכאן אל הנהר: מערב אל הגשר הישן, ומזרח אל גשר המילים השבור.","מעבר לגשר הישן נמצא השער לגן השורשים."]);return;}

}

function bindCase(){

  const tReset=()=>{C.stepShown=null;C.tcheck=null;$("#case").scrollTop=0;};

  on("mStep",()=>{C.mShown++;renderCase();});
  on("mBack",()=>{C.phase="teach";C.teachIdx=C.l.teach.length-1;C.stepShown=99;C.tcheck=null;renderCase();});
  on("mDone",()=>{if(C.readOnly){closeCase();return;}C.phase="practice";nextPractice();});
  on("wSave",()=>{const t=($("#myWords").value||"").trim();if(t.split(/\s+/).length<3){$("#wErr").hidden=false;return;}

  bindItem();
}

function bindItem(){

function grade(it,st){

      if(!it._again&&C.extra<6){const sim=shuffleArr(L(it._l).pool.filter(i=>!C.usedK.has(i.k)&&skill(i)===skill(it)));if(sim.length){C.usedK.add(sim[0].k);C.list.push({...sim[0],_l:it._l,_again:true});C.extra++;C.retryNote="exam";}}}
    save();}
  if(C.phase==="challenge"||C.phase==="spaced"){C.score+=sc;C.count++;}
  if(C.phase==="zexam"){C.score+=sc;C.count++;C.per[it._l]=sc;recSkill(it._l,skill(it),sc);}
  if(C.phase==="clue"&&sc>=.999&&!P.clues.includes(C.clue.id)){P.clues.push(C.clue.id);addPts(PTS.clue);save();}
  if(C.phase==="review"){C.score+=sc;if(sc>=.999)P.review=P.review.filter(r=>r.k!==it.k);save();}
}
function advance(){
  if(C.phase==="exp"){C.phase="teach";C.teachIdx=0;C.stepShown=null;C.tcheck=null;renderCase();$("#case").scrollTop=0;return;}
  if(C.phase==="practice"){C.retryNote=null;nextPractice();return;}
  if(C.phase==="judge"){if(C.judgeAgain){C.judgeAgain=false;serve(C.l.judge[0],"again");return;}finish();return;}
  if(C.phase==="review"){nextReview();return;}
  if(C.phase==="exam"){C.retryNote=null;nextExam();return;}
  if(C.phase==="challenge"){nextChallenge();return;}
  if(C.phase==="spaced"){nextSpaced();return;}
  if(C.phase==="zexam"){nextZoneExam();return;}
  if(C.phase==="clue"){if(C.state&&C.state.score>=.999){closeCase();}else serve(C.list[0]);return;}
}
/* skills: a wrong answer brings back a similar question (same skill), or the same one reshuffled */
const SK=Object.assign(SK0,{a18:"trait",a19:"trait",v16:"body",v5:"time",v6:"time",v15:"time",v7:"body",v11:"body",a3:"agree",a6:"agree",a7:"agree",a8:"agree",a13:"agree",a10:"trait",a14:"trait",a15:"trait",a5:"rule",a16:"rule"});
const skill=it=>it.sk||SK[it.k]||it.type;
const TIPS={noun:{_:1},adj:{_:3,agree:2,rule:1,tap:0,trait:"trait"},verb:{_:1,time:2,body:1},sort3:{_:0},nikud:{_:1}};
const TRAIT={h:"תכונות אופי",html:`<p>תכונת אופי היא שם תואר שמתאר <b>איך אדם מתנהג בדרך כלל</b>.</p><div class="flow"><div><i>1</i>קוראים מה הדמות עושה שוב ושוב.</div><div><i>2</i>שואלים: איזה הוא? איך הוא מתנהג?</div><div><i>3</i>בוחרים את התכונה שמתאימה: לומד הרבה ← שקדן · מחזיר הכול למקום ← מסודר.</div></div>`};
function tipFor(lid,sk){const m=TIPS[lid]||{_:0};const v=m[sk]!==undefined?m[sk]:m._;if(v==="trait")return TRAIT;return L(lid).teach[v]||L(lid).teach[0];}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuf(it){
  const c={...it};
  if(it.type==="choice"){const idx=shuffleArr(it.opts.map((_,i)=>i));c.opts=idx.map(i=>it.opts[i]);c.a=idx.indexOf(it.a);}
  else if(it.type==="sort"){let items;for(let t=0;t<8;t++){items=shuffleArr(it.items);if(items.map(x=>x[0]).join()!==it.items.map(x=>x[0]).join())break;}c.items=items;}
  else if(it.type==="tap"&&it.grid){const idx=shuffleArr(it.words.map((_,i)=>i));c.words=idx.map(i=>it.words[i]);c.targets=it.targets.map(t=>idx.indexOf(t));}
  return c;
}
function serve(it,retry){if(C.cur&&C.state&&C.state.checked)C.hist.push({it:C.cur,st:C.state,tab:C._tab||"",phase:C.cur._phase||C.phase});C.view=-1;C.cur=shuf(it);C.cur._phase=C.phase;C.cur._retry=retry||"";C.state=null;renderCase();$("#case").scrollTop=0;}
function nextPractice(){
  if(C.lvlMsg){const m=C.lvlMsg;C.lvlMsg=null;flash(m==="up"?`עליתם לרמה ${["א","ב","ג"][C.level-1]}!`:`עוברים לרמה ${["א","ב","ג"][C.level-1]}, עם עוד רמזים`);}
  // after a mistake: an easier question on the same rule, a short explanation, then a question at the original level
  if(C.queue.length){const q=C.queue.shift();
    if(q.t==="explain"){serve({type:"explain",sk:q.sk,why:q.why},"explain");return;}
    const same=C.l.pool.filter(i=>!C.used.has(i.k)&&skill(i)===q.sk&&i.k!==q.k);
    let pick=q.t==="easier"?same.filter(i=>i.lv<=q.lv):same.filter(i=>i.lv===q.lv);
    if(pick.length&&q.t==="easier"){const top=Math.max(...pick.map(i=>i.lv));pick=pick.filter(i=>i.lv===top);}
    if(!pick.length)pick=same.filter(i=>i.lv<=q.lv);if(!pick.length)pick=same;
    if(pick.length){const it=pick[Math.floor(Math.random()*pick.length)];C.used.add(it.k);serve(it,q.t);}
    else serve(C.l.pool.find(i=>i.k===q.k),q.t);
    return;}
  if(C.newServed>=C.practiceN){C.phase="judge";serve(C.l.judge[0]);return;}
  const pool=C.l.pool.filter(i=>!C.used.has(i.k));
  let cand=pool.filter(i=>i.lv===C.level);if(!cand.length)cand=pool.filter(i=>Math.abs(i.lv-C.level)===1);if(!cand.length)cand=pool;
  const it=cand[Math.floor(Math.random()*cand.length)];C.used.add(it.k);C.newServed++;serve(it);
}
function nextReview(){if(C.idx>=C.list.length){C.phase="result";C.reviewDone=true;renderCase();return;}const it=C.list[C.idx++];serve(it);}
function flash(t){const d=document.createElement("div");d.className="toast";d.style.position="fixed";d.style.zIndex=50;d.style.top="auto";d.style.bottom="calc(env(safe-area-inset-bottom,0px) + 24px)";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function finish(){
  const pct=Math.round(C.score/C.count*100);const l=C.l;const prev=P.solved[l.id];const wasDone=prev&&prev.done;
  const done=pct>=PASS;const wasPerfect=!!(prev&&prev.perfect);const perfect=pct>=100;
  P.solved[l.id]={best:Math.max(pct,prev?prev.best:0),done:done||!!wasDone,perfect:perfect||wasPerfect,at:(prev&&prev.at)||Date.now()};
  if(done&&!wasDone)addPts(PTS.case);C.newPerfect=perfect&&!wasPerfect;if(C.newPerfect)addPts(PTS.perfect);P.level[l.id]=C.level;save();C.pct=pct;C.newDone=done&&!wasDone;if(C.newDone)P.spaced.push({l:l.id,due:Date.now()+SPACE[0]*DAY,step:0});save();C.phase="words";renderCase();$("#case").scrollTop=0;
}
function resultHTML(){
  if(C.zDone){const weak=LESSONS.filter(l=>(C.per[l.id]??1)<.999);
    return `<div class="folder result" data-tab="מבחן הכניסה לשלב הבא"><div class="score">${C.zPct}%</div><div class="bigstamp ${C.zOk?"":"retry"}">${C.zOk?"בלשים מומחים!":"עוד לא"}</div>
    <p>${C.zOk?`עברתם את מבחן הכניסה. השער לגן השורשים נפתח לפניכם! (+${PTS.zone} נקודות)`:`כדי לעבור צריך ${PASS}%. חזרו על הבתים שבהם טעיתם, ונסו שוב עם שאלות חדשות.`}</p>
    ${weak.length?`<div class="perfect" style="text-align:right"><b>${C.zOk?"כדאי לרענן:":"לחזור על:"}</b>${weak.map(l=>`<button class="btn soft" style="margin-top:8px;width:100%" data-learn2="${l.id}">${l.building} · ${l.title.split(":")[0]}</button>`).join("")}</div>`:""}
    <div class="case-actions">${C.zOk?"":`<button class="btn soft" id="zAgain">לנסות שוב</button>`}<button class="btn primary" id="done">${C.from==="world"?"חזרה לעולם":"סיום"}</button></div></div>`;}
  if(C.spDone){return `<div class="folder result" data-tab="תעלומת היום"><div class="score">${Math.round(C.score)}/3</div><div class="bigstamp ${C.spOk?"":"retry"}">${C.spOk?"זכור!":"נחזור מחר"}</div>
    <p>${C.spOk?(C.spNext?`מצוין, הכלל זכור. החזרה הבאה על ${L(C.sl).building} תהיה בעוד ${C.spNext} ימים.`:`מצוין! ${L(C.sl).building} זכור לכם היטב, ואין צורך בעוד חזרות.`):`כדאי לרענן את הכלל. אפשר לקרוא שוב את השיעור, ומחר תקבלו שוב 3 שאלות.`}</p>
    <div class="case-actions">${C.spOk?"":`<button class="btn soft" data-learn2="${C.sl}">לקרוא שוב את השיעור</button>`}<button class="btn primary" id="done">סיום</button></div></div>`;}
  if(C.chalDone){const st=C.star;return `<div class="folder result" data-tab="כוכב אתגר"><div class="bigstamp ${C.chalOk?"":"retry"}" style="font-size:44px">${C.chalOk?"★ נאסף!":"עוד לא"}</div>
    <p>${C.chalOk?`אספתם את הכוכב ״${esc(st.title)}״ וקיבלתם ${st.pts} נקודות!`:`כדי לאסוף את הכוכב צריך לענות נכון על כל השאלות. אפשר לחזור לשיעורים במחברת הבלש, ולנסות שוב מתי שרוצים.`}</p>
    <p class="muted">כוכבים שנאספו: ${P.stars.length} מתוך ${STARS.length}</p>
    <div class="case-actions">${C.chalOk?"":`<button class="btn soft" id="chalAgain">לנסות שוב</button>`}<button class="btn primary" id="done">${C.from==="world"?"חזרה לעולם":"סיום"}</button></div></div>`;}
  if(C.examDone){const pct=C.count?Math.round(C.score/C.count*100):0;const rows=Object.entries(C.per).map(([id,r])=>({l:L(id),p:Math.round(r.s/r.c*100)})).sort((a,b)=>a.p-b.p);const weak=rows.filter(r=>r.p<PASS);
    return `<div class="folder result" data-tab="סיכום התרגול"><div class="score">${pct}%</div><p>${pct>=PASS?"מוכנים למבחן! כל הכבוד.":"עוד קצת חזרה ואתם שם."}</p>
    <div class="stack" style="text-align:right;margin-top:8px">${rows.map(r=>`<div class="trow"><b>${r.l.title.split(":")[0]}</b><div class="bar"><i style="width:${r.p}%;background:${r.p>=PASS?"var(--good)":"var(--stamp)"}"></i></div><span>${r.p}%</span></div>`).join("")}</div>
    ${weak.length?`<div class="perfect" style="text-align:right;margin-top:14px"><b>כדאי לחזור על:</b>${weak.map(r=>`<button class="btn soft" style="margin-top:8px;width:100%" data-learn2="${r.l.id}">לקרוא שוב: ${r.l.title.split(":")[0]}</button>`).join("")}</div>`:""}
    <div class="case-actions"><button class="btn soft" id="examAgain">תרגול נוסף</button><button class="btn primary" id="done">סיום</button></div></div>`;}
  if(C.reviewDone){return `<div class="folder result" data-tab="חזרה"><div class="score">${Math.round(C.score)}/${C.list.length}</div><p>תשובות נכונות בחזרה. שאלות שענית עליהן נכון יצאו מהרשימה.</p><div class="case-actions"><button class="btn primary" id="done">סיום</button></div></div>`;}
  const l=C.l,ok=C.pct>=PASS;const i=LESSONS.indexOf(l),nx=LESSONS[i+1];
  const pass=ok?`<div class="passpop"><b>✓ עברתם את ה־${PASS}%!</b>${nx?(C.newDone?`הבית הבא נפתח: ${i+2}. ${nx.building} (${nx.title.split(":")[0]}). אפשר לעבור למשימה הבאה.`:`אפשר לעבור למשימה הבאה: ${nx.building}.`):`זה היה הבית האחרון ברובע. ${gateOpen()?"השער לאזור 2 נפתח!":""}`}</div>`:"";
  const perf=C.newPerfect?`<div class="perfect"><b>★ מושלם! 100%</b>בונוס של ${PTS.perfect} נקודות. הכוכב יופיע ליד הבית במפה.</div>`:(ok&&C.pct<100&&!(P.solved[l.id]&&P.solved[l.id].perfect)?`<div class="perfect"><b>★ אתגר: 100%</b>מי שמפענח את התיק בלי טעויות מקבל בונוס של ${PTS.perfect} נקודות. אפשר לנסות שוב מתי שרוצים.</div>`:"");
  return `<div class="folder result" data-tab="סיכום התיק"><div class="score">${C.pct}%</div><div class="bigstamp ${ok?"":"retry"}">${ok?"פוענח!":"עוד לא"}</div>${pass}${perf}
  <p>${ok?(C.newDone?`+${PTS.case} נקודות על פענוח התיק. כרטיס ״${l.clue.h}״ נוסף למחברת הבלש.`:"כל הכבוד! התיק כבר היה מפוענח, והתרגול נשמר."):`תיק נחשב פוענח מ־${PASS}%. אפשר לנסות שוב עכשיו, והשאלות שטעיתם בהן מחכות גם ב״תיקים פתוחים״.`}</p>
  <p class="muted">רמה בסיום: ${["א","ב","ג"][C.level-1]}</p>
  <div class="sum">${Object.entries(l.sum).map(([k,v])=>`<div><b>${k}?</b>${esc(v)}</div>`).join("")}</div>
  <div class="case-actions">${!ok||C.pct<100?`<button class="btn soft" id="again">${ok?"לנסות להגיע ל־100%":"לנסות שוב"}</button>`:""}<button class="btn primary" id="done">${C.from==="world"?"חזרה לעולם":"סיום"}</button></div></div>`;
}
